<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>courses</title>
    <link rel="stylesheet" href="/semestr1/assets/css/courses.css">
</head>
<body>
<header>
    <nav class="main-nav" data-js-main-nav>
        <div class="main-logo">
            <!-- Путь к изображению через корень веб-приложения -->
            <img src="/semestr1/assets/images/index/logo.jpg" alt="логотип">
        </div>

        <ul>
            <li><a href="../">Главная</a></li>
            <li><a href="/semestr1/html/press/press.html">Курсы</a></li>
            <li><a href="/semestr1/html/contacts/contacts.html">Контакты</a></li>
        </ul>

        <div class="enter-logo" data-js-enter-logo>
            <img src="/semestr1/assets/images/index/autorization.png" alt="авторизация">
        </div>
    </nav>

    <div id="popup" class="hidden" data-js-popup>
        <div class="popup-content" data-js-popup-content>
            <form action="../enter" method="post">
                <div class="enter-user">
                    <ul>
                        <li>
                            <label>login</label>
                            <input type="text" name="login" required>
                        </li>
                        <li>
                            <label>email</label>
                            <input type="text" name="email" required>
                        </li>
                        <li>
                            <label>password</label>
                            <input type="password" name="password" required>
                        </li>
                        <li>
                            <label>message</label>
                            <input type="text" name="message" required>
                        </li>
                        <li>
                            <button type="submit">войти</button>
                            <button type="button">регистрация</button>
                        </li>
                    </ul>
                </div>
            </form>
        </div>
    </div>

</header>

<main>
    <p>
        <div class="library-courses">
            <a href="/semestr1/courses-changes">библиотека курсов</a>
        </div>
    </p>
    <p>
        <form action="/semestr1/add-courses-admin" method="post">
            <div class="courses-admin">
                <ul>
                    <li>
                        <label>course name</label>
                        <input type="text" name="course-name" required>
                    </li>
                    <li>
                        <label>price</label>
                        <input type="text" name="price" required>
                    </li>
                    <li>
                        <button type="add">добавить</button>
                    </li>
                </ul>
            </div>
        </form>
    </p>

    <p>
        <form action="/semestr1/delete-courses-admin" method="post">
            <div class="courses-admin">
                <ul>
                    <li>
                        <label>course id</label>
                        <input type="text" name="course-id" required>
                    </li>

                    <li>
                        <button type="delete">удалить</button>
                    </li>
                </ul>
            </div>
        </form>
    </p>

    <p>
        <form action="/semestr1/update-courses-admin" method="post">
            <div class="courses-admin">
                <ul>
                    <li>
                        <label>course id</label>
                        <input type="text" name="course-id" required>
                    </li>

                    <li>
                        <label>price</label>
                        <input type="text" name="price" required>
                    </li>

                    <li>
                        <button type="update">обновить</button>
                    </li>
                </ul>
            </div>
        </form>
    </p>

</main>

<footer>

</footer>

<script src="/semestr1/assets/js/script.js"></script>
</body>
</html>
